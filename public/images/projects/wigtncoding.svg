<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="claude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1100" height="640" fill="#0a0a0f"/>
  <circle cx="870" cy="40" r="170" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>

  <text x="46" y="58" font-size="27" font-weight="750" fill="#fafafa">WIGTN Plugin for Claude Code</text>
  <text x="46" y="84" font-size="13" fill="#9ca3af">v0.1.16 · one contract from product intent to reviewed delivery</text>
  <g transform="translate(808 39)">
    <rect width="246" height="46" rx="23" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="123" y="29" text-anchor="middle" font-size="13" font-weight="650" fill="#f9a8d4">11 agents · 5 commands · 7 skills</text>
  </g>

  <g transform="translate(46 128)">
    <g>
      <rect width="230" height="214" rx="16" fill="#ffffff" opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect width="230" height="5" rx="3" fill="url(#claude)"/>
      <text x="20" y="42" font-size="11" font-weight="700" fill="#fb7185" letter-spacing="1.4">01 · SPECIFY</text>
      <text x="20" y="74" font-size="24" font-weight="750" fill="#fafafa">/prd</text>
      <text x="20" y="99" font-size="12" fill="#9ca3af">Repository context → PRD + PLAN</text>
      <text x="20" y="135" font-size="11" fill="#d1d5db">prd-reviewer</text>
      <text x="20" y="157" font-size="11" fill="#6b7280">Completeness · Feasibility</text>
      <text x="20" y="175" font-size="11" fill="#6b7280">Security · Consistency</text>
      <text x="20" y="198" font-size="11" font-weight="650" fill="#fca5a5">PASS · WARN · BLOCKED</text>
    </g>

    <g transform="translate(258)">
      <rect width="230" height="214" rx="16" fill="#ffffff" opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect width="230" height="5" rx="3" fill="url(#claude)"/>
      <text x="20" y="42" font-size="11" font-weight="700" fill="#fb7185" letter-spacing="1.4">02 · DESIGN</text>
      <text x="20" y="74" font-size="24" font-weight="750" fill="#fafafa">/screen-spec</text>
      <text x="20" y="99" font-size="12" fill="#9ca3af">Optional UI gate · 5 artifacts</text>
      <text x="20" y="135" font-size="11" fill="#d1d5db">IA · User Flow · Screen Spec</text>
      <text x="20" y="157" font-size="11" fill="#6b7280">Clickable Wireframe HTML</text>
      <text x="20" y="175" font-size="11" fill="#6b7280">Dev Handoff</text>
      <text x="20" y="198" font-size="11" font-weight="650" fill="#c4b5fd">20 design styles</text>
    </g>

    <g transform="translate(516)">
      <rect width="230" height="214" rx="16" fill="#ffffff" opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect width="230" height="5" rx="3" fill="url(#claude)"/>
      <text x="20" y="42" font-size="11" font-weight="700" fill="#fb7185" letter-spacing="1.4">03 · BUILD</text>
      <text x="20" y="74" font-size="24" font-weight="750" fill="#fafafa">/implement</text>
      <text x="20" y="99" font-size="12" fill="#9ca3af">Dependency-aware parallel delivery</text>
      <text x="20" y="135" font-size="11" fill="#d1d5db">Backend · Frontend</text>
      <text x="20" y="157" font-size="11" fill="#d1d5db">AI Server · Ops</text>
      <text x="20" y="180" font-size="11" fill="#6b7280">SHARED_CONTEXT + PLAN ledger</text>
      <text x="20" y="198" font-size="11" font-weight="650" fill="#86efac">Independent work only</text>
    </g>

    <g transform="translate(774)">
      <rect width="230" height="214" rx="16" fill="#ffffff" opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect width="230" height="5" rx="3" fill="url(#claude)"/>
      <text x="20" y="42" font-size="11" font-weight="700" fill="#fb7185" letter-spacing="1.4">04 · RELEASE</text>
      <text x="20" y="74" font-size="24" font-weight="750" fill="#fafafa">/auto-commit</text>
      <text x="20" y="99" font-size="12" fill="#9ca3af">Evidence → checks → authority</text>
      <text x="20" y="135" font-size="11" fill="#d1d5db">file · line · severity · evidence</text>
      <text x="20" y="157" font-size="11" fill="#6b7280">typecheck · lint · repo checks</text>
      <text x="20" y="180" font-size="11" fill="#6b7280">commit only · draft PR · PR</text>
      <text x="20" y="198" font-size="11" font-weight="650" fill="#fde68a">Final user checkpoint</text>
    </g>
  </g>

  <g transform="translate(46 370)">
    <rect width="1004" height="96" rx="16" fill="#ffffff" opacity="0.025" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="31" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1.4">7 REUSABLE SKILLS</text>
    <text x="20" y="58" font-size="12" fill="#d1d5db">review levels · design system · screen spec · team memory · hand-drawn diagrams · WIGTN presentation</text>
    <text x="20" y="79" font-size="12" fill="#d1d5db">knowledge-wiki · reusable session learning → generalized article → gated local-first publication</text>
  </g>

  <g transform="translate(46 492)">
    <rect width="1004" height="98" rx="16" fill="#ec4899" opacity="0.055" stroke="#ec4899" stroke-opacity="0.22"/>
    <text x="20" y="31" font-size="11" font-weight="700" fill="#f9a8d4" letter-spacing="1.4">KNOWLEDGE WIKI · FOUR-GATE EXPORT BOUNDARY</text>
    <text x="20" y="59" font-size="12" fill="#e5e7eb">scope → deterministic secret scan → LLM compile + independent audit → deterministic output scan</text>
    <text x="20" y="80" font-size="11" fill="#9ca3af">local by default · no remote, no push · per-user/ only · shared/ promotion stays human-reviewed</text>
  </g>
</svg>
