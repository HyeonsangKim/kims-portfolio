<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <rect width="1100" height="620" fill="#0a0a0f"/>

  <text x="550" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#fafafa">WIGENT — 30-Turn Multi-Agent Debate → Landing Page</text>

  <g transform="translate(280,60)">
    <rect width="10" height="10" rx="3" fill="#22d3ee"/>
    <text x="16" y="10" font-size="11" fill="rgba(255,255,255,0.6)">Browser (React 19)</text>
    <rect x="170" width="10" height="10" rx="3" fill="#a855f7"/>
    <text x="186" y="10" font-size="11" fill="rgba(255,255,255,0.6)">Orchestrator (Next.js)</text>
    <rect x="360" width="10" height="10" rx="3" fill="#fbbf24"/>
    <text x="376" y="10" font-size="11" fill="rgba(255,255,255,0.6)">AI (GPT-4o)</text>
  </g>

  <!-- BROWSER -->
  <g transform="translate(30,90)">
    <rect width="280" height="260" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <text x="16" y="26" font-size="10" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">BROWSER</text>
    <text x="16" y="50" font-size="17" font-weight="700" fill="#fafafa">React 19 + useReducer</text>
    <text x="16" y="68" font-size="11" fill="rgba(255,255,255,0.5)">Slack-style chat UI + iframe sandbox</text>

    <g transform="translate(14,84)">
      <rect width="252" height="28" rx="6" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1"/>
      <text x="10" y="19" font-size="11" fill="#a5f3fc">TopicInput · PresetButtons</text>

      <rect y="34" width="252" height="28" rx="6" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1"/>
      <text x="10" y="53" font-size="11" fill="#a5f3fc">useDebate (13-event SSE)</text>

      <rect y="68" width="252" height="28" rx="6" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1"/>
      <text x="10" y="87" font-size="11" fill="#a5f3fc">ChatLayout (Slack UI)</text>

      <rect y="102" width="252" height="28" rx="6" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1"/>
      <text x="10" y="121" font-size="11" fill="#a5f3fc">LandingPageView (iframe)</text>
    </g>
    <text x="16" y="242" font-size="10" fill="rgba(255,255,255,0.4)" font-style="italic">+ HistoryList · PageTransition</text>
  </g>

  <!-- Arrow Browser → Orchestrator -->
  <g transform="translate(312,220)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="rgba(168,85,247,0.6)" stroke-width="1.5"/>
    <polygon points="26,0 20,-4 20,4" fill="rgba(168,85,247,0.6)"/>
    <text x="0" y="-8" font-size="9" fill="rgba(168,85,247,0.8)">SSE stream</text>
  </g>

  <!-- ORCHESTRATOR -->
  <g transform="translate(342,90)">
    <rect width="310" height="260" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <text x="16" y="26" font-size="10" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">ORCHESTRATOR</text>
    <text x="16" y="50" font-size="17" font-weight="700" fill="#fafafa">AsyncGenerator</text>
    <text x="16" y="68" font-size="11" fill="rgba(255,255,255,0.5)">POST /api/debate</text>

    <g transform="translate(14,84)">
      <rect width="282" height="24" rx="5" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="1"/>
      <text x="10" y="16" font-size="10" fill="#d8b4fe">1. agents_created (JSON)</text>

      <rect y="30" width="282" height="48" rx="5" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="1"/>
      <text x="10" y="46" font-size="10" font-weight="600" fill="#d8b4fe">2. 30-turn free debate (stream)</text>
      <text x="10" y="62" font-size="9" fill="rgba(255,255,255,0.45)">retire/spawn at turn 12, 22 · convergence at 25</text>

      <rect y="84" width="282" height="24" rx="5" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="1"/>
      <text x="10" y="100" font-size="10" fill="#d8b4fe">3. summarize (JSON)</text>

      <rect y="114" width="282" height="24" rx="5" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="1"/>
      <text x="10" y="130" font-size="10" fill="#d8b4fe">4. final_result (JSON)</text>

      <rect y="144" width="282" height="24" rx="5" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="1"/>
      <text x="10" y="160" font-size="10" fill="#d8b4fe">5. landing_page HTML (stream)</text>
    </g>
  </g>

  <!-- Arrow Orchestrator → AI -->
  <g transform="translate(654,220)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="rgba(251,191,36,0.6)" stroke-width="1.5"/>
    <polygon points="26,0 20,-4 20,4" fill="rgba(251,191,36,0.6)"/>
    <text x="0" y="-8" font-size="9" fill="rgba(251,191,36,0.8)">OpenAI API</text>
  </g>

  <!-- AI -->
  <g transform="translate(684,90)">
    <rect width="280" height="260" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <text x="16" y="26" font-size="10" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">AI</text>
    <text x="16" y="50" font-size="17" font-weight="700" fill="#fafafa">GPT-4o</text>
    <text x="16" y="68" font-size="11" fill="rgba(255,255,255,0.5)">7 prompt functions</text>

    <g transform="translate(14,84)">
      <rect width="252" height="52" rx="6" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="500" fill="#fde68a">callJSON (x5)</text>
      <text x="10" y="38" font-size="10" fill="rgba(255,255,255,0.45)">JSON mode · t=0.9 · 30s timeout</text>

      <rect y="60" width="252" height="52" rx="6" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1"/>
      <text x="10" y="80" font-size="11" font-weight="500" fill="#fde68a">streamSpeak (x2)</text>
      <text x="10" y="98" font-size="10" fill="rgba(255,255,255,0.45)">agent speech · landing HTML</text>
    </g>
  </g>

  <!-- 30-TURN TIMELINE -->
  <g transform="translate(30,380)">
    <rect width="1040" height="110" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="22" font-size="10" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">30-TURN DEBATE TIMELINE</text>

    <line x1="40" y1="60" x2="1000" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <polygon points="1000,60 994,56 994,64" fill="rgba(255,255,255,0.2)"/>

    <circle cx="40" cy="60" r="4" fill="#22d3ee"/>
    <text x="40" y="84" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">0</text>

    <circle cx="140" cy="60" r="4" fill="#22d3ee"/>
    <text x="140" y="84" text-anchor="middle" font-size="9" fill="#22d3ee">designer joins</text>
    <text x="140" y="96" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">turn 3</text>

    <circle cx="400" cy="60" r="5" fill="#a855f7"/>
    <text x="400" y="84" text-anchor="middle" font-size="9" fill="#a855f7">retire + spawn</text>
    <text x="400" y="96" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">turn 12</text>

    <circle cx="700" cy="60" r="5" fill="#a855f7"/>
    <text x="700" y="84" text-anchor="middle" font-size="9" fill="#a855f7">retire + spawn</text>
    <text x="700" y="96" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">turn 22</text>

    <circle cx="1000" cy="60" r="5" fill="#ef4444"/>
    <text x="960" y="84" text-anchor="end" font-size="9" fill="#ef4444">convergence</text>
    <text x="960" y="96" text-anchor="end" font-size="8" fill="rgba(255,255,255,0.4)">turn 25-29</text>
  </g>

  <!-- DUAL-PATH LANDING -->
  <g transform="translate(30,510)">
    <rect width="1040" height="72" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="22" font-size="10" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">DUAL-PATH LANDING GENERATION</text>

    <rect x="16" y="34" width="200" height="28" rx="6" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="1"/>
    <text x="116" y="52" text-anchor="middle" font-size="10" fill="#a7f3d0">Template render (0s) · 9 templates</text>

    <text x="232" y="52" font-size="10" fill="rgba(255,255,255,0.3)">first arrived wins →</text>

    <rect x="370" y="34" width="200" height="28" rx="6" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.3)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="470" y="52" text-anchor="middle" font-size="10" fill="rgba(251,191,36,0.6)">GPT-4o HTML streaming (backup)</text>

    <text x="590" y="52" font-size="10" fill="rgba(255,255,255,0.3)">+ Human-in-the-Loop: reject → +8 turns</text>
  </g>

  <text x="550" y="608" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.25)" font-style="italic">7+ agentic patterns · PM + Designer fixed · Build with TRAE 2026 Grand Prize</text>
</svg>
